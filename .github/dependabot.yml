# Weekly dependency updates. Minor and patch updates are grouped into one PR per ecosystem;
# major updates arrive as individual PRs so each gets a deliberate review.
# Security updates are raised immediately regardless of this schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # Dependabot does not honor rust-version, and alloy majors raise the MSRV past the pinned
      # toolchain (alloy 2.x needs rustc 1.94.1). They also touch the signing and verifying
      # crypto paths. Upgrade alloy majors by hand, together with rust-toolchain.toml, the
      # workspace rust-version, and a cargo audit review.
      - dependency-name: "alloy-*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # crosscheck/requirements.txt is generated by pip-compile from requirements.in; Dependabot
  # recognizes the header and re-resolves the whole pinned set, so coupled packages (for example
  # pydantic and pydantic-core) move together.
  - package-ecosystem: pip
    directory: /crosscheck
    schedule:
      interval: weekly
    groups:
      crosscheck:
        update-types: [minor, patch]
