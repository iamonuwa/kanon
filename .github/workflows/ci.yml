name: CI

# Checks that protect the corpus: fmt and clippy for hygiene, cargo test for the load-bearing
# tests (generator-vs-verifier self-check, byte-identity reproducibility check, schema validation,
# negative-control verdict), a dependency audit, and an independent Python signature cross-check.
# The weekly schedule surfaces a newly published advisory even without a commit.
#
# Job names are required status checks on `main`; renaming one requires updating branch
# protection in the same change. Third-party actions are pinned to full commit SHAs (the trailing
# comment names the release); Dependabot proposes updates.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

# Minimal token scope; this workflow reads the repo and needs nothing else.
permissions:
  contents: read

# Cancel superseded runs on the same ref to avoid wasted CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain matches rust-toolchain.toml; keep the two in lockstep.
      - name: Install Rust (1.92, with rustfmt and clippy)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      # --locked fails the build if Cargo.lock is out of date with Cargo.toml.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Nonce replay performance regression (release, isolated)
        run: cargo test -p kanon-core --release --locked replay_lookup_time_is_bounded_for_absent_nonce -- --ignored --nocapture --test-threads=1
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  audit:
    name: audit (dependency advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit
      # Honors .cargo/audit.toml: the three accepted unmaintained advisories are ignored, while any
      # new or vulnerable advisory is an un-ignored warning and fails the job.
      - name: Audit
        run: cargo audit --deny warnings

  crosscheck:
    name: crosscheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies (pinned)
        run: pip install -r crosscheck/requirements.txt
      - name: Cross-check committed vectors
        run: python crosscheck/verify.py vectors
      - name: Self-test (tamper detection)
        run: python -m pytest crosscheck/test_crosscheck.py -q
