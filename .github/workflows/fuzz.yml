name: Fuzz

# Exercises the rule that the verifier never panics on adversarial input, beyond what unit tests
# cover. Weekly and on demand rather than per PR, since a useful run takes minutes. A crash
# fails the job and uploads the reproducing input as an artifact.
on:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC, after CI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_vector:
    name: fuzz (verify_vector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz (prebuilt)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz
      - name: Seed corpus from committed vectors
        run: |
          mkdir -p fuzz/corpus/verify_vector
          find vectors -name '*.json' -exec cp {} fuzz/corpus/verify_vector/ \;
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own target, where the
      # sanitizer cannot link; build for the runner's glibc target instead.
      - name: Fuzz for 10 minutes
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu verify_vector -- -max_total_time=600
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
